<svg viewBox="0 0 760 320" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans',Arial,sans-serif" role="img" aria-label="Difference-in-differences, idealised. A treated group and a comparison group follow parallel trends before a change. After the change, the treated group rises above the path implied by the comparison group's trend. The gap between the observed treated line and that dashed counterfactual path is the estimated effect."><defs><marker id="pc-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/></marker><marker id="pc-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0057ff"/></marker></defs><text x="52.0" y="24.0" text-anchor="start" font-size="15" font-weight="700" fill="#0a1628">Difference-in-differences, in one picture</text><text x="52.0" y="43.0" text-anchor="start" font-size="12" fill="#526078">Idealised: the comparison group shows what the treated group would have done</text><rect x="331.0" y="60" width="279.0" height="206" fill="#fff4d8" opacity=".6"/><line x1="331.0" y1="60" x2="331.0" y2="266" stroke="#0a1628" stroke-dasharray="4 3"/><text x="337.0" y="74.0" text-anchor="start" font-size="11" font-weight="700" fill="#0a1628">change starts</text><line x1="52" y1="266" x2="610" y2="266" stroke="#526078"/><text x="331.0" y="288.0" text-anchor="middle" font-size="11.5" fill="#0a1628">time</text><text transform="translate(18 163.0) rotate(-90)" text-anchor="middle" font-size="11.5" fill="#0a1628">outcome</text><polyline points="52.0,241.3 102.7,237.2 153.5,233.0 204.2,228.9 254.9,224.8 305.6,220.7 356.4,216.6 407.1,212.4 457.8,208.3 508.5,204.2 559.3,200.1 610.0,196.0" fill="none" stroke="#526078" stroke-width="2.2"/><polyline points="305.6,163.0 356.4,158.9 407.1,154.8 457.8,150.6 508.5,146.5 559.3,142.4 610.0,138.3" fill="none" stroke="#b07800" stroke-width="2"