<svg viewBox="0 0 760 360" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans',Arial,sans-serif" role="img" aria-label="Four groups of customers, defined by what they would do with and without a retention offer. Persuadables leave without the offer and stay with it. Sure things stay either way. Lost causes leave either way. Sleeping dogs stay without the offer and leave because of it. A churn-risk score ranks lost causes and persuadables alike; only the persuadables are worth the offer."><defs><marker id="pu-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/></marker><marker id="pu-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0057ff"/></marker></defs><text x="20.0" y="26.0" text-anchor="start" font-size="15" font-weight="700" fill="#0a1628">A high churn score doesn't mean an offer will help</text><text x="20.0" y="45.0" text-anchor="start" font-size="12" fill="#526078">Each customer has two possible outcomes. Only one is ever observed.</text><text x="470.0" y="60.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0a1628">If we make the offer…</text><text x="345.0" y="82.0" text-anchor="middle" font-size="11.5" fill="#526078">…they stay</text><text x="595.0" y="82.0" text-anchor="middle" font-size="11.5" fill="#526078">…they leave</text><text x="204.0" y="60.0" text-anchor="end" font-size="12" font-weight="700" fill="#0a1628">Without the offer…</text><text x="204.0" y="154.0" text-anchor="end" font-size="11.5" fill="#526078">…they leave</text><rect x="224" y="98" width="242" height="112" rx="5" fill="#fff4d8" stroke="#b07800" stroke-width="2.2"/><text x="345.0" y="152.0" text-anchor="middle" font-size="15" font-weight="700" fill="#b07800">Persuadables</text><text x="345.0" y="172.0" text-anchor="middle" font-size="11.5" fill="#526078">the offer changes the outcome</text><rect x="474" y="98" width="242" height="112" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.2"/><text x="595.0" y="152.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0a1628">Lost causes</text><text x="595.0" y="172.0" text-anchor="middle" font-size="11.5" fill="#526078">high risk, the offer doesn't help</text><text x="204.0" y="274.0" text-anchor="end" font-size="11.5" fill="#526078">…they stay</text><rect x="224" y="218" width="242" height="112" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.2"/><text x="345.0" y="272.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0a1628">Sure things</text><text x="345.0" y="292.0" text-anchor="middle" font-size="11.5" fill="#526078">stay anyway: the offer is a cost</text><rect x="474" y="218" width="242" height="112" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.2"/><text x="595.0" y="272.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0a1628">Sleeping dogs</text><text x="595.0" y="292.0" text-anchor="middle" font-size="11.5" fill="#526078">the contact itself drives them away</text><line x1="738" y1="100" x2="738" y2="208" stroke="#0a1628" stroke-width="1.4"/><text x="748.0" y="140.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#0a1628">a churn score</text><text x="748.0" y="156.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#0a1628">ranks this</text><text x="748.0" y="172.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#0a1628">whole row high</text><text x="20.0" y="346.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#0a1628">An uplift model estimates, for customers like this one, how much the offer changes the chance of leaving.</text></svg>