<svg viewBox="0 0 740 230" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans',Arial,sans-serif" role="img" aria-label="Example latency budget from sound onset to action: buffer the analysis window 25 ms, features 2 ms, inference 8 ms, decision smoothing (3 hops) 30 ms, wake + act 5 ms, about 70 ms in total. In this example, inference is a small share; buffering and decision smoothing dominate."><defs><marker id="el-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/></marker><marker id="el-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0057ff"/></marker></defs><text x="30.0" y="26.0" text-anchor="start" font-size="15" font-weight="700" fill="#0a1628">Where the milliseconds go — an example budget</text><text x="30.0" y="45.0" text-anchor="start" font-size="11.5" fill="#526078">25 ms window · 10 ms hop · 3-hop smoothing. Real values come from profiling on your device.</text><rect x="30.0" y="92" width="212.5" height="40" fill="#eaf0fc" stroke="#0a1628" stroke-width="1.2"/><text x="136.2" y="117.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0a1628">25 ms</text><line x1="136.2" y1="132" x2="136.2" y2="142" stroke="#526078"/><text x="136.2" y="154.0" text-anchor="middle" font-size="11" fill="#0a1628">buffer the analysis window</text><rect x="242.5" y="92" width="17.0" height="40" fill="#fff" stroke="#0a1628" stroke-width="1.2"/><line x1="251.0" y1="132" x2="251.0" y2="162" stroke="#526078"/><text x="251.0" y="174.0" text-anchor="middle" font-size="11" fill="#0a1628">features · 2 ms</text><rect x="259.5" y="92" width="68.0" height="40" fill="#0057ff" stroke="#0057ff" stroke-width="1.2"/><text x="293.5" y="117.0" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">8 ms</text><line x1="293.5" y1="132" x2="293.5" y2="142" stroke="#526078"/><text x="293.5" y="154.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0057ff">inference</text><rect x="327.5" y="92" width="255.0" height="40" fill="#fff" stroke="#0a1628" stroke-width="1.2"/><text x="455.0" y="117.0" text-anchor="middle" font-size="12" font-weight="700" fill="#0a1628">30 ms</text><line x1="455.0" y1="132" x2="455.0" y2="162" stroke="#526078"/><text x="455.0" y="174.0" text-anchor="middle" font-size="11" fill="#0a1628">decision smoothing (3 hops)</text><rect x="582.5" y="92" width="42.5" height="40" fill="#eaf0fc" stroke="#0a1628" stroke-width="1.2"/><line x1="603.8" y1="132" x2="603.8" y2="142" stroke="#526078"/><text x="603.8" y="154.0" text-anchor="middle" font-size="11" fill="#0a1628">wake + act · 5 ms</text><line x1="30" y1="80" x2="30" y2="144" stroke="#0a1628" stroke-width="1.6"/><text x="30.0" y="74.0" text-anchor="start" font-size="11" font-weight="600" fill="#0a1628">sound onset</text><line x1="625.0" y1="80" x2="625.0" y2="144" stroke="#0a1628" stroke-width="1.6"/><text x="625.0" y="74.0" text-anchor="middle" font-size="11" font-weight="700" fill="#0a1628">device acts ≈ 70 ms</text><text x="30.0" y="212.0" text-anchor="middle" font-size="10" fill="#526078">0</text><line x1="30.0" y1="196" x2="30.0" y2="200" stroke="#526078"/><text x="115.0" y="212.0" text-anchor="middle" font-size="10" fill="#526078">10</text><line x1="115.0" y1="196" x2="115.0" y2="200" stroke="#526078"/><text x="200.0" y="212.0" text-anchor="middle" font-size="10" fill="#526078">20</text><line x1="200.0" y1="196" x2="200.0" y2="200" stroke="#526078"/><text x="285.0" y="212.0" text-anchor="middle" font-size="10" fill="#526078">30</text><line x1="285.0" y1="196" x2="285.0" y2="200" stroke="#526078"/><text x="370.0" y="212.0" text-anchor="middle" font-size="10" fill="#526078">40</text><line x1="370.0" y1="196" x2="370.0" y2="200" stroke="#526078"/><text x="455.0" y="212.0" text-anchor="middle" font-size="10" fill="#526078">50</text><line x1="455.0" y1="196" x2="455.0" y2="200" stroke="#526078"/><text x="540.0" y="212.0" text-anchor="middle" font-size="10" fill="#526078">60</text><line x1="540.0" y1="196" x2="540.0" y2="200" stroke="#526078"/><text x="625.0" y="212.0" text-anchor="middle" font-size="10" fill="#526078">70</text><line x1="625.0" y1="196" x2="625.0" y2="200" stroke="#526078"/><text x="710.0" y="212.0" text-anchor="end" font-size="10" fill="#526078">80 ms</text><line x1="710.0" y1="196" x2="710.0" y2="200" stroke="#526078"/><line x1="30" y1="196" x2="710" y2="196" stroke="#526078"/></svg>