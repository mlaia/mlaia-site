<svg viewBox="0 0 740 330" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans',Arial,sans-serif" role="img" aria-label="Feedforward ANC: an outer reference microphone feeds a filter that drives the speaker, racing the noise's acoustic path to the ear. Feedback ANC: an error microphone at the ear closes a loop through a controller and the speaker; suppression in one band is paid for by amplification in another."><defs><marker id="aa-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/></marker><marker id="aa-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0057ff"/></marker></defs><text x="20.0" y="26.0" text-anchor="start" font-size="15" font-weight="700" fill="#0a1628">Feedforward</text><text x="20.0" y="44.0" text-anchor="start" font-size="11.5" fill="#526078">outer mic hears the noise first</text><circle cx="50" cy="86" r="15" fill="#fff" stroke="#0a1628" stroke-width="1.6"/><text x="50.0" y="90.0" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0a1628">noise</text><polyline points="65.0,86.0 320.0,86.0 320.0,186.0" fill="none" stroke="#0057ff" stroke-width="2.2" marker-end="url(#aa-b)"/><text x="190.0" y="78.0" text-anchor="middle" font-size="10.5" fill="#0057ff">acoustic path to the ear</text><circle cx="320" cy="200" r="13" fill="#fff" stroke="#0a1628" stroke-width="1.8"/><text x="320.0" y="205.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0a1628">+</text><text x="338.0" y="204.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0a1628">ear</text><text x="400.0" y="26.0" text-anchor="start" font-size="15" font-weight="700" fill="#0a1628">Feedback</text><text x="400.0" y="44.0" text-anchor="start" font-size="11.5" fill="#526078">inner mic measures what reaches the ear</text><circle cx="430" cy="86" r="15" fill="#fff" stroke="#0a1628" stroke-width="1.6"/><text x="430.0" y="90.0" text-anchor="middle" font-size="10.5" font-weight="600" fill="#0a1628">noise</text><polyline points="445.0,86.0 700.0,86.0 700.0,186.0" fill="none" stroke="#0057ff" stroke-width="2.2" marker-end="url(#aa-b)"/><text x="570.0" y="78.0" text-anchor="middle" font-size="10.5" fill="#0057ff">acoustic path to the ear</text><circle cx="700" cy="200" r="13" fill="#fff" stroke="#0a1628" stroke-width="1.8"/><text x="700.0" y="205.0" text-anchor="middle" font-size="15" font-weight="700" fill="#0a1628">+</text><text x="718.0" y="204.0" text-anchor="start" font-size="11.5" font-weight="600" fill="#0a1628">ear</text><polyline points="50.0,101.0 50.0,180.0" fill="none" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aa-a)"/><text x="56.0" y="145.0" text-anchor="start" font-size="10.5" fill="#526078">reaches mic first</text><circle cx="50" cy="194" r="9" fill="#fff" stroke="#0a1628" stroke-width="1.8"/><text x="50.0" y="222.0" text-anchor="middle" font-size="10.5" fill="#526078">ref mic</text><polyline points="59.0,194.0 88.0,194.0" fill="none" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aa-a)"/><rect x="90" y="176" width="128" height="40" rx="5" fill="#eaf0fc" stroke="#0057ff" stroke-width="2"/><text x="154.0" y="200.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0a1628">ADC → filter → DAC</text><polyline points="218.0,196.0 240.0,196.0" fill="none" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aa-a)"/><rect x="242" y="176" width="52" height="40" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.4"/><text x="268.0" y="200.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0a1628">driver</text><polyline points="294.0,198.0 305.0,199.0" fill="none" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aa-a)"/><text x="268.0" y="236.0" text-anchor="middle" font-size="10.5" fill="#526078">anti-noise</text><text x="20.0" y="268.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#0a1628">Electronic path must be shorter than the acoustic</text><text x="20.0" y="285.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#0a1628">path, or the anti-noise arrives late (causality).</text><text x="20.0" y="305.0" text-anchor="start" font-size="11.5" fill="#526078">Depends on fit; no loop to go unstable.</text><polyline points="700.0,213.0 700.0,248.0" fill="none" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aa-a)"/><circle cx="700" cy="258" r="9" fill="#fff" stroke="#0a1628" stroke-width="1.8"/><text x="716.0" y="262.0" text-anchor="start" font-size="10.5" fill="#526078">error mic</text><polyline points="691.0,258.0 602.0,258.0" fill="none" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aa-a)"/><text x="648.0" y="250.0" text-anchor="middle" font-size="10.5" fill="#526078">residual</text><rect x="480" y="238" width="120" height="40" rx="5" fill="#eaf0fc" stroke="#0057ff" stroke-width="2"/><text x="540.0" y="262.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0a1628">controller C</text><polyline points="540.0,238.0 540.0,216.0" fill="none" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aa-a)"/><rect x="510" y="176" width="60" height="40" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.4"/><text x="540.0" y="200.5" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0a1628">driver</text><polyline points="570.0,198.0 685.0,199.0" fill="none" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aa-a)"/><text x="630.0" y="190.0" text-anchor="middle" font-size="10.5" fill="#526078">anti-noise</text><text x="400.0" y="305.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#0a1628">Closed loop: no reference needed, but suppression in one</text><text x="400.0" y="322.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#0a1628">band is paid for with a boost elsewhere (waterbed effect).</text><line x1="372" y1="14" x2="372" y2="324" stroke="#dce3f0"/></svg>