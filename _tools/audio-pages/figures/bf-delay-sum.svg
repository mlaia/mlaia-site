<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans',Arial,sans-serif" role="img" aria-label="Delay-and-sum: a plane wave from angle theta reaches each microphone later by d times sine theta over c; delaying each channel to cancel that offset makes the target add in phase at the sum."><defs><marker id="ds-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/></marker><marker id="ds-arrow-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0057ff"/></marker></defs><line x1="36.1" y1="230.0" x2="399.8" y2="20.0" stroke="#526078" stroke-width="1.4" stroke-opacity="1"/><line x1="13.1" y1="190.2" x2="376.8" y2="-19.8" stroke="#526078" stroke-width="1.4" stroke-opacity="0.55"/><line x1="-9.9" y1="150.3" x2="353.8" y2="-59.7" stroke="#526078" stroke-width="1.4" stroke-opacity="0.3"/><text x="393.8" y="12.0" text-anchor="end" font-size="11.5" fill="#526078">wavefront</text><line x1="40" y1="36" x2="75.0" y2="96.6" stroke="#0a1628" stroke-width="1.6" marker-end="url(#ds-arrow)"/><text x="44" y="22" font-size="12" font-weight="600" fill="#0a1628">plane wave from θ</text><line x1="140" y1="170" x2="140" y2="78" stroke="#526078" stroke-width="1" stroke-dasharray="3 3"/><path d="M140,110 A60,60 0 0 0 110.0,118.0" fill="none" stroke="#0a1628" stroke-width="1"/><text x="118" y="104" font-size="13" fill="#0a1628">θ</text><line x1="222.5" y1="122.4" x2="250" y2="170" stroke="#0057ff" stroke-width="2.6"/><text x="258" y="136" font-size="12" font-weight="700" fill="#0057ff">d·sinθ</text><text x="258" y="150" font-size="11" fill="#0057ff">extra path</text><circle cx="140" cy="170" r="7" fill="#fff" stroke="#0a1628" stroke-width="2"/><text x="152" y="188" font-size="11" fill="#526078">mic 1</text><circle cx="250" cy="170" r="7" fill="#fff" stroke="#0a1628" stroke-width="2"/><text x="262" y="188" font-size="11" fill="#526078">mic 2</text><circle cx="360" cy="170" r="7" fill="#fff" stroke="#0a1628" stroke-width="2"/><text x="372" y="188" font-size="11" fill="#526078">mic 3</text><circle cx="470" cy="170" r="7" fill="#fff" stroke="#0a1628" stroke-width="2"/><text x="482" y="188" font-size="11" fill="#526078">mic 4</text><line x1="140" y1="200" x2="250" y2="200" stroke="#0a1628" stroke-width="1" marker-start="url(#ds-arrow)" marker-end="url(#ds-arrow)"/><text x="195.0" y="196" text-anchor="middle" font-size="12" fill="#0a1628">d</text><line x1="140" y1="178" x2="140" y2="222" stroke="#0a1628" stroke-width="1.2"/><rect x="114" y="222" width="52" height="28" rx="4" fill="#eaf0fc" stroke="#0057ff" stroke-width="1.4"/><text x="140" y="241" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">+3Δ</text><line x1="250" y1="178" x2="250" y2="222" stroke="#0a1628" stroke-width="1.2"/><rect x="224" y="222" width="52" height="28" rx="4" fill="#eaf0fc" stroke="#0057ff" stroke-width="1.4"/><text x="250" y="241" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">+2Δ</text><line x1="360" y1="178" x2="360" y2="222" stroke="#0a1628" stroke-width="1.2"/><rect x="334" y="222" width="52" height="28" rx="4" fill="#eaf0fc" stroke="#0057ff" stroke-width="1.4"/><text x="360" y="241" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">+Δ</text><line x1="470" y1="178" x2="470" y2="222" stroke="#0a1628" stroke-width="1.2"/><rect x="444" y="222" width="52" height="28" rx="4" fill="#eaf0fc" stroke="#0057ff" stroke-width="1.4"/><text x="470" y="241" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">+0</text><line x1="140" y1="250" x2="285.2" y2="306" stroke="#0a1628" stroke-width="1.2" marker-end="url(#ds-arrow)"/><line x1="250" y1="250" x2="298.4" y2="306" stroke="#0a1628" stroke-width="1.2" marker-end="url(#ds-arrow)"/><line x1="360" y1="250" x2="311.6" y2="306" stroke="#0a1628" stroke-width="1.2" marker-end="url(#ds-arrow)"/><line x1="470" y1="250" x2="324.8" y2="306" stroke="#0a1628" stroke-width="1.2" marker-end="url(#ds-arrow)"/><circle cx="305.0" cy="322" r="16" fill="#fff" stroke="#0a1628" stroke-width="2"/><text x="305.0" y="328" text-anchor="middle" font-size="17" font-weight="700" fill="#0a1628">Σ</text><line x1="321.0" y1="322" x2="415.0" y2="322" stroke="#0057ff" stroke-width="2" marker-end="url(#ds-arrow-b)"/><text x="423.0" y="318" font-size="12" font-weight="700" fill="#0a1628">target adds in phase</text><text x="423.0" y="334" font-size="11.5" fill="#526078">other directions partly cancel</text><rect x="544" y="220" width="160" height="50" rx="6" fill="#fff" stroke="#dce3f0"/><text x="624" y="241" text-anchor="middle" font-size="13" font-weight="700" fill="#0a1628">Δ = d·sinθ / c</text><text x="624" y="259" text-anchor="middle" font-size="11" fill="#526078">c ≈ 343 m/s</text></svg>