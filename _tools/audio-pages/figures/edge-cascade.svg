<svg viewBox="0 0 760 250" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans',Arial,sans-serif" role="img" aria-label="Wake-word cascade: microphone audio goes through an always-on front-end and a tiny first-stage detector on a low-power core. Only candidates wake the main core, where a larger verifier confirms before the device acts. Rejections are discarded at either stage."><defs><marker id="ec-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/></marker><marker id="ec-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0057ff"/></marker></defs><rect x="96" y="30" width="330" height="136" rx="8" fill="#eaf0fc" stroke="#0057ff" stroke-dasharray="5 4"/><text x="108.0" y="50.0" text-anchor="start" font-size="10.5" font-weight="700" fill="#0057ff">ALWAYS ON · runs every hop · low-power core / DSP</text><rect x="496" y="30" width="170" height="136" rx="8" fill="#fff" stroke="#526078" stroke-dasharray="5 4"/><text x="508.0" y="50.0" text-anchor="start" font-size="10.5" font-weight="700" fill="#526078">WOKEN ON DEMAND · main core</text><rect x="20" y="80" width="60" height="44" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.4"/><text x="50.0" y="106.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">mic</text><polyline points="80.0,102.0 110.0,102.0" fill="none" stroke="#0a1628" stroke-width="1.4" marker-end="url(#ec-a)"/><rect x="112" y="80" width="120" height="44" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.4"/><text x="172.0" y="99.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">front-end</text><text x="172.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#526078">log-mel features</text><polyline points="232.0,102.0 262.0,102.0" fill="none" stroke="#0a1628" stroke-width="1.4" marker-end="url(#ec-a)"/><rect x="264" y="80" width="146" height="44" rx="5" fill="#eaf0fc" stroke="#0057ff" stroke-width="2"/><text x="337.0" y="99.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0a1628">stage 1: tiny detector</text><text x="337.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#526078">cheap, tuned for recall</text><polyline points="410.0,102.0 512.0,102.0" fill="none" stroke="#0057ff" stroke-width="2" marker-end="url(#ec-b)"/><text x="461.0" y="94.0" text-anchor="middle" font-size="10.5" fill="#0057ff">candidates only</text><rect x="514" y="80" width="136" height="44" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.4"/><text x="582.0" y="99.0" text-anchor="middle" font-size="11.5" font-weight="700" fill="#0a1628">stage 2: verifier</text><text x="582.0" y="114.0" text-anchor="middle" font-size="10.5" fill="#526078">larger, tuned for precision</text><polyline points="650.0,102.0 686.0,102.0" fill="none" stroke="#0a1628" stroke-width="1.4" marker-end="url(#ec-a)"/><rect x="688" y="80" width="52" height="44" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.4"/><text x="714.0" y="106.5" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">act</text><polyline points="337.0,124.0 337.0,196.0" fill="none" stroke="#0a1628" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ec-a)"/><polyline points="582.0,124.0 582.0,196.0" fill="none" stroke="#0a1628" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ec-a)"/><text x="337.0" y="214.0" text-anchor="middle" font-size="11" fill="#526078">most audio stops here</text><text x="582.0" y="214.0" text-anchor="middle" font-size="11" fill="#526078">false candidates rejected</text><text x="20.0" y="240.0" text-anchor="start" font-size="11.5" font-weight="700" fill="#0a1628">Idle power is set by everything inside the blue frame, because it runs on every hop.</text></svg>