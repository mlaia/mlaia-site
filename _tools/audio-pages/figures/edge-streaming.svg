<svg viewBox="0 0 860 270" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans',Arial,sans-serif" role="img" aria-label="Without streaming, every hop recomputes all frames in the model's window. With streaming, cached intermediate state is reused and each hop computes only the newest frame, so compute per hop drops roughly by the number of frames in the window."><defs><marker id="es-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/></marker><marker id="es-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0057ff"/></marker></defs><text x="20.0" y="74.0" text-anchor="start" font-size="13" font-weight="700" fill="#0a1628">Re-run the window</text><text x="20.0" y="91.0" text-anchor="start" font-size="11" fill="#526078">every frame, every hop</text><rect x="210" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="234" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="258" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="282" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="306" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="330" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="354" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="378" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="402" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="426" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="450" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="474" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="498" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="522" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="546" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="570" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="594" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="618" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="642" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><rect x="666" y="60" width="20" height="36" rx="3" fill="#0057ff" stroke="#0057ff" stroke-width="1.4"/><text x="700.0" y="83.0" text-anchor="start" font-size="12" font-weight="700" fill="#0a1628">20 frames per hop</text><text x="20.0" y="174.0" text-anchor="start" font-size="13" font-weight="700" fill="#0a1628">Stream with cached state</text><text x="20.0" y="191.0" text-anchor="start" font-size="11" fill="#526078">reuse earlier work</text><rect x="210" y="160" width="20" height="36" rx="3" fill="#fff" stroke="#dce3f0" stroke-width="1.4"/><rect x="234" y="160" width="20" height="36" rx="3" fill="#fff" stroke="#dce3f0" stroke-width="1.4"/><rect x="258" y="160" width="20" height="36" rx="3" fill="#fff" stroke="#dce3f0" stroke-width="1.4"/><rect x="282" y="160" width="20" height="36" rx="3" fill="#fff" stroke="#dce3f0" stroke-width="1.4"/><rect x="306" y="160" width="20" height="36" rx="3" fill="#fff" stroke="#dce3f0" stroke-width="1.4"/><rect x="330" y="160" width="20" height="36" rx="3" fill="#fff" stroke="#dce3f0" stroke-width="1.4"/><rect x="354" y="160" width="20" height="36" rx="