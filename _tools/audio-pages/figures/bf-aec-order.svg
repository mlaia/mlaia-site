<svg viewBox="0 0 720 330" xmlns="http://www.w3.org/2000/svg" font-family="'DM Sans',Arial,sans-serif" role="img" aria-label="Two orderings of echo cancellation and beamforming. A: one canceller per microphone before the beamformer, cost grows with microphone count but each canceller sees a fixed echo path. B: one canceller after the beamformer, cheaper but the echo path it models changes whenever the beam steers."><defs><marker id="aec-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#0a1628"/></marker></defs><text x="24" y="40" font-size="13.5" font-weight="700" fill="#0a1628">A · Cancel echo per microphone</text><rect x="24" y="70" width="70" height="40" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.4"/><text x="59.0" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">Mics</text><line x1="94" y1="90" x2="148" y2="90" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aec-arrow)"/><text x="122.0" y="83" text-anchor="middle" font-size="10.5" fill="#526078">N ch</text><rect x="150" y="70" width="110" height="40" rx="5" fill="#eaf0fc" stroke="#0057ff" stroke-width="2"/><text x="205.0" y="90" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">AEC × N</text><text x="205.0" y="103" text-anchor="middle" font-size="10.5" fill="#526078">one per mic</text><line x1="260" y1="90" x2="314" y2="90" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aec-arrow)"/><text x="288.0" y="83" text-anchor="middle" font-size="10.5" fill="#526078">N ch</text><rect x="316" y="70" width="110" height="40" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.4"/><text x="371.0" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">Beamformer</text><line x1="426" y1="90" x2="480" y2="90" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aec-arrow)"/><text x="454.0" y="83" text-anchor="middle" font-size="10.5" fill="#526078">1 ch</text><rect x="482" y="70" width="100" height="40" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.4"/><text x="532.0" y="95" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">Post-filter</text><line x1="582" y1="90" x2="624" y2="90" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aec-arrow)"/><text x="604.0" y="83" text-anchor="middle" font-size="10.5" fill="#526078">out</text><text x="632" y="95" font-size="12" font-weight="600" fill="#0a1628">to codec / ASR</text><line x1="205.0" y1="48" x2="205.0" y2="68" stroke="#0057ff" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#aec-arrow)"/><text x="211.0" y="58" font-size="10.5" fill="#0057ff">loudspeaker reference</text><text x="24" y="134" font-size="12" font-weight="700" fill="#0a1628">Cost grows with N.</text><text x="162" y="134" font-size="12" fill="#526078">Each canceller models a fixed loudspeaker-to-mic path.</text><text x="24" y="195" font-size="13.5" font-weight="700" fill="#0a1628">B · Cancel echo after the beam</text><rect x="24" y="225" width="70" height="40" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.4"/><text x="59.0" y="250" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">Mics</text><line x1="94" y1="245" x2="148" y2="245" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aec-arrow)"/><text x="122.0" y="238" text-anchor="middle" font-size="10.5" fill="#526078">N ch</text><rect x="150" y="225" width="110" height="40" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.4"/><text x="205.0" y="250" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">Beamformer</text><line x1="260" y1="245" x2="314" y2="245" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aec-arrow)"/><text x="288.0" y="238" text-anchor="middle" font-size="10.5" fill="#526078">1 ch</text><rect x="316" y="225" width="110" height="40" rx="5" fill="#eaf0fc" stroke="#0057ff" stroke-width="2"/><text x="371.0" y="245" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">AEC × 1</text><text x="371.0" y="258" text-anchor="middle" font-size="10.5" fill="#526078">single canceller</text><line x1="426" y1="245" x2="480" y2="245" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aec-arrow)"/><text x="454.0" y="238" text-anchor="middle" font-size="10.5" fill="#526078">1 ch</text><rect x="482" y="225" width="100" height="40" rx="5" fill="#fff" stroke="#0a1628" stroke-width="1.4"/><text x="532.0" y="250" text-anchor="middle" font-size="12.5" font-weight="700" fill="#0a1628">Post-filter</text><line x1="582" y1="245" x2="624" y2="245" stroke="#0a1628" stroke-width="1.4" marker-end="url(#aec-arrow)"/><text x="604.0" y="238" text-anchor="middle" font-size="10.5" fill="#526078">out</text><text x="632" y="250" font-size="12" font-weight="600" fill="#0a1628">to codec / ASR</text><line x1="371.0" y1="203" x2="371.0" y2="223" stroke="#0057ff" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#aec-arrow)"/><text x="377.0" y="213" font-size="10.5" fill="#0057ff">loudspeaker reference</text><text x="24" y="289" font-size="12" font-weight="700" fill="#0a1628">One canceller.</text><text x="133" y="289" font-size="12" fill="#526078">The echo path it models changes whenever the beam steers.</text><line x1="24" y1="160" x2="696" y2="160" stroke="#dce3f0"/></svg>